<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Animated Telemetry Waveforms in background -->
  <g opacity="0.45">
    <path d="M -50 170 Q 200 80, 450 170 T 950 170" fill="none" stroke="#38bdf8" stroke-width="2.5">
      <animate attributeName="d" values="M -50 170 Q 200 80, 450 170 T 950 170; M -50 170 Q 200 230, 450 170 T 950 170; M -50 170 Q 200 80, 450 170 T 950 170" dur="6s" repeatCount="indefinite" />
    </path>
    <path d="M -50 190 Q 250 250, 450 190 T 950 190" fill="none" stroke="#818cf8" stroke-width="2">
      <animate attributeName="d" values="M -50 190 Q 250 250, 450 190 T 950 190; M -50 190 Q 250 110, 450 190 T 950 190; M -50 190 Q 250 250, 450 190 T 950 190" dur="7s" repeatCount="indefinite" />
    </path>
    <path d="M -50 140 Q 300 60, 550 140 T 950 140" fill="none" stroke="#c084fc" stroke-width="1.8">
      <animate attributeName="d" values="M -50 140 Q 300 60, 550 140 T 950 140; M -50 140 Q 300 210, 550 140 T 950 140; M -50 140 Q 300 60, 550 140 T 950 140" dur="8s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Animated Pulse Nodes / Data Packets -->
  <circle cx="150" cy="80" r="3" fill="#38bdf8">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="r" values="2;4;2" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="750" cy="65" r="3.5" fill="#818cf8">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite" />
    <animate attributeName="r" values="2.5;4.5;2.5" dur="3.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="820" cy="180" r="3" fill="#c084fc">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite" />
    <animate attributeName="r" values="2;4;2" dur="2.8s" repeatCount="indefinite" />
  </circle>
  <circle cx="80" cy="190" r="2.5" fill="#38bdf8">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" repeatCount="indefinite" />
  </circle>

  <!-- Category Pills (Background accents) -->
  <g transform="translate(145, 175)">
    <rect width="130" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <text x="65" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#7dd3fc">📊 Log Dashboards</text>
  </g>
  <g transform="translate(290, 175)">
    <rect width="145" height="28" rx="14" fill="rgba(129, 140, 248, 0.12)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1" />
    <text x="72.5" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc">⚡ Real-Time Analytics</text>
  </g>
  <g transform="translate(450, 175)">
    <rect width="135" height="28" rx="14" fill="rgba(192, 132, 252, 0.12)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1" />
    <text x="67.5" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#d8b4fe">🔍 Observability Stack</text>
  </g>
  <g transform="translate(600, 175)">
    <rect width="155" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <text x="77.5" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#7dd3fc">🚀 SaaS &amp; Open Source</text>
  </g>

  <!-- Foreground Title and Subtitle -->
  <text x="50%" y="75" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="38" fill="url(#titleGrad)" filter="url(#glow)">
    Awesome Log Analytics &amp; Dashboards
  </text>
  <text x="50%" y="125" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="17" fill="#94a3b8">
    Curated Hub of SaaS Platforms &amp; Self-Hosted Open-Source Observability Dashboards
  </text>
</svg>